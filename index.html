<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f5b">
<title>ÉcoÉnergie</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef7f1;color:#20332b}
header{background:#087f5b;color:white;text-align:center;padding:22px}
header h1{margin:0 0 8px}
header p{margin:0}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
button{font:inherit;background:#087f5b;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}
nav button{flex:1;min-width:90px}
main{max-width:850px;margin:auto;padding:12px}
section{display:none}
section.active{display:block}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:12px}
label{display:block;margin:12px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #b9cfc2;border-radius:6px;font:inherit}
button.action{display:block;width:100%;margin-top:12px}
.danger{background:#a83232}
.msg{padding:12px 0;white-space:pre-wrap}
.row{padding:12px 0;border-bottom:1px solid #ddd}
.row button{margin-top:8px}
#erreur{color:#a83232;font-weight:bold}
</style>
</head>

<body>
<header>
<h1>ÉcoÉnergie</h1>
<p>Les apprentis inventeurs</p>
</header>

<nav>
<button type="button" data-page="home">Accueil</button>
<button type="button" data-page="devices">Appareils</button>
<button type="button" data-page="monitor">Surveillance</button>
<button type="button" data-page="history">Historique</button>
</nav>

<main>
<p id="erreur" role="alert"></p>

<section id="home" class="active">
<div class="card">
<h2>Tableau de bord</h2>
<div id="stats"></div>
<button type="button" class="action" data-page="devices">Ajouter un appareil</button>
</div>

<div class="card">
<h2>Écran LCD</h2>
<p id="lcd">Non connecté</p>
<button type="button" id="connect">Connecter en USB</button>
</div>
</section>

<section id="devices">
<div class="card">
<h2>Ajouter un appareil</h2>

<label for="name">Nom de l'appareil</label>
<input id="name" placeholder="Exemple : ventilateur">

<label for="power">Puissance</label>
<input id="power" type="number" min="0" value="75">

<label for="unit">Unité</label>
<select id="unit">
<option value="1">W</option>
<option value="1000">kW</option>
<option value="1000000">MW</option>
</select>

<label for="rate">Tarif en FCFA/kWh</label>
<input id="rate" type="number" min="0" value="100">

<label for="start">Début de l'horaire</label>
<input id="start" type="time" value="08:00">

<label for="end">Fin de l'horaire</label>
<input id="end" type="time" value="10:00">

<button type="button" class="action" id="addTime">Ajouter une page horaire</button>
<div id="times"></div>

<button type="button" class="action" id="addDevice">Ajouter l'appareil</button>
<div id="message" class="msg" role="status"></div>
</div>

<div class="card">
<h2>Appareils enregistrés</h2>
<div id="list"></div>
<button type="button" class="danger action" id="reset">Réinitialiser les appareils</button>
</div>
</section>

<section id="monitor">
<div class="card">
<h2>Surveillance</h2>
<label for="limit">Limite journalière en kWh</label>
<input id="limit" type="number" min="0.01" value="5">
<p id="diagnostic"></p>
</div>
</section>

<section id="history">
<div class="card">
<h2>Historique automatique</h2>
<div id="logs"></div>
<button type="button" class="danger action" id="clear">Effacer l'historique</button>
</div>
</section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
let devices = [];
let logs = [];
let times = [];
let writer = null;

function error(message) {
  $("erreur").textContent = message;
}

function msg(message) {
  $("message").textContent = message;
}

function load(key) {
  try {
    const data = JSON.parse(localStorage.getItem(key) || "[]");
    return Array.isArray(data) ? data : [];
  } catch (e) {
    return [];
  }
}

function save() {
  try {
    localStorage.setItem("appareilsEco", JSON.stringify(devices));
    localStorage.setItem("historiqueEco", JSON.stringify(logs));
  } catch (e) {
    error("Enregistrement local indisponible.");
  }
}

function minutes(time) {
  if (typeof time !== "string" || !time.includes(":")) return NaN;
  const parts = time.split(":").map(Number);
  return parts[0] * 60 + parts[1];
}

function duration(t) {
  return (minutes(t.fin) - minutes(t.debut)) / 60;
}

function totals() {
  let p = 0, e = 0, c = 0;
  devices.forEach(a => {
    const w = Number(a.puissance) || 0;
    const d = Number(a.duree) || 0;
    const r = Number(a.tarif) || 0;
    p += w;
    e += w * d / 1000;
    c += w * d * r / 1000;
  });
  return {p, e, c};
}

function button(label, action) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.addEventListener("click", action);
  return b;
}

function record(action) {
  logs.unshift({
    date: new Date().toLocaleString("fr-FR"),
    action: action,
    e: totals().e.toFixed(2)
  });
  logs = logs.slice(0, 100);
  save();
  render();
}

function render() {
  const t = totals();

  $("stats").textContent =
    "Appareils : " + devices.length +
    " | Puissance : " + t.p.toFixed(0) + " W" +
    " | Énergie : " + t.e.toFixed(2) + " kWh/jour" +
    " | Coût : " + t.c.toFixed(2) + " FCFA/jour" +
    " | Mois : " + (t.c * 30).toFixed(2) + " FCFA";

  const timeList = $("times");
  timeList.textContent = "";

  times.forEach((t, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.append(document.createTextNode(t.debut + " – " + t.fin + " "));
    row.append(button("Supprimer cet horaire", () => {
      times.splice(i, 1);
      render();
    }));
    timeList.append(row);
  });

  const list = $("list");
  list.textContent = "";

  devices.forEach((a, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.append(document.createTextNode(
      String(a.nom || "Appareil") + " : " +
      (Number(a.puissance) || 0) + " W, " +
      (Number(a.duree) || 0) + " h/jour "
    ));
    row.append(button("Supprimer", () => {
      devices.splice(i, 1);
      record("Suppression");
    }));
    list.append(row);
  });

  if (!devices.length) list.textContent = "Aucun appareil enregistré.";

  $("logs").textContent = logs.map(l =>
    String(l.date || "") + " — " +
    String(l.action || "Action") + " : " +
    String(l.e || "0") + " kWh"
  ).join("\n") || "Aucun historique";

  $("diagnostic").textContent =
    t.e > Number($("limit").value)
      ? "Limite dépassée"
      : "Consommation estimée : " + t.e.toFixed(2) + " kWh/jour";
}

function showPage(id) {
  document.querySelectorAll("section").forEach(s => {
    s.classList.toggle("active", s.id === id);
  });
}

function addTime() {
  const debut = $("start").value;
  const fin = $("end").value;
  const d = minutes(debut);
  const f = minutes(fin);

  if (!Number.isFinite(d) || !Number.isFinite(f) || f <= d) {
    msg("Choisis une heure de fin après l'heure de début.");
    return;
  }

  if (times.some(t => d < minutes(t.fin) && f > minutes(t.debut))) {
    msg("Cet horaire chevauche un horaire déjà ajouté.");
    return;
  }

  times.push({debut, fin});
  render();
  msg("Page horaire ajoutée avec succès.");
}

function addDevice() {
  const nom = $("name").value.trim();
  const puissance = Number($("power").value) * Number($("unit").value);
  const tarif = Number($("rate").value);

  if (!nom || !(puissance > 0) || !Number.isFinite(puissance) ||
      !Number.isFinite(tarif) || tarif < 0 || !times.length) {
    msg("Renseigne le nom, la puissance, le tarif et ajoute un horaire.");
    return;
  }

  devices.push({
    nom,
    puissance,
    tarif,
    duree: times.reduce((s, t) => s + duration(t), 0),
    pagesHoraires: times.slice()
  });

  times = [];
  $("name").value = "";
  record("Ajout");
  msg("Appareil ajouté avec succès.");
}

async function connectLCD() {
  try {
    if (!navigator.serial) {
      $("lcd").textContent = "Web Serial indisponible sur cet appareil.";
      return;
    }
    const port = await navigator.serial.requestPort();
    await port.open({baudRate: 9600});
    writer = port.writable.getWriter();
    await writer.write(new TextEncoder().encode(
      "ECOENERGIE " + totals().c.toFixed(0) + "\n"
    ));
    $("lcd").textContent = "Connecté";
  } catch (e) {
    $("lcd").textContent = "Connexion impossible : " + e.message;
  }
}

function init() {
  try {
    devices = load("appareilsEco");
    logs = load("historiqueEco");

    document.querySelectorAll("[data-page]").forEach(b => {
      b.addEventListener("click", () => showPage(b.dataset.page));
    });

    $("addTime").addEventListener("click", addTime);
    $("addDevice").addEventListener("click", addDevice);
    $("limit").addEventListener("input", render);
    $("connect").addEventListener("click", connectLCD);

    $("reset").addEventListener("click", () => {
      if (confirm("Supprimer tous les appareils ?")) {
        devices = [];
        record("Réinitialisation");
      }
    });

    $("clear").addEventListener("click", () => {
      if (confirm("Effacer l'historique ?")) {
        logs = [];
        save();
        render();
      }
    });

    render();
  } catch (e) {
    error("Erreur de démarrage : " + e.message);
  }
}

init();
</script>
</body>
</html>
