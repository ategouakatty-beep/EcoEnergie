<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÉcoÉnergie</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px Arial,sans-serif;background:#eef6f0;color:#183c2d}
header{background:#087f5b;color:white;text-align:center;padding:18px}
header h1{margin:0}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
button{font:inherit;border:0;border-radius:8px;background:#087f5b;
color:white;padding:12px;cursor:pointer}
nav button{flex:1}
main{max-width:850px;margin:auto;padding:12px}
section{display:none}
section.active{display:block}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:12px}
label{display:block;margin-top:12px}
input,select{width:100%;padding:11px;margin-top:5px;
font:inherit;border:1px solid #aac8b8;border-radius:6px}
.full{width:100%;margin-top:12px}
.row{padding:12px 0;border-bottom:1px solid #ddd}
.danger{background:#a83232}
.small{font-size:14px}
#message{color:#a83232;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h1>ÉcoÉnergie</h1>
<p>Les apprentis inventeurs</p>
<button id="lang">English</button>
</header>

<nav>
<button data-page="home" data-fr="Accueil" data-en="Home"></button>
<button data-page="devices" data-fr="Appareils" data-en="Devices"></button>
<button data-page="history" data-fr="Historique" data-en="History"></button>
</nav>

<main>
<section id="home" class="active">
<div class="card">
<h2 data-fr="Tableau de bord" data-en="Dashboard"></h2>
<div id="stats"></div>
<button class="full" data-page="devices"
data-fr="Ajouter un appareil" data-en="Add a device"></button>
</div>
<div class="card">
<h2 data-fr="Conseils d’économie" data-en="Energy saving tips"></h2>
<div id="tips"></div>
</div>
</section>

<section id="devices">
<div class="card">
<h2 data-fr="Ajouter un appareil" data-en="Add a device"></h2>

<label data-fr="Pays" data-en="Country"></label>
<select id="country"></select>

<p id="currency"></p>
<label id="rateLabel"></label>
<input id="rate" type="number" min="0" step="any">
<p class="small" id="rateHelp"></p>

<label data-fr="Nom de l’appareil" data-en="Device name"></label>
<input id="name" placeholder="Télévision">

<label data-fr="Puissance" data-en="Power"></label>
<input id="power" type="number" min="0" step="any">
<select id="unit">
<option value="1">W</option>
<option value="1000">kW</option>
<option value="1000000">MW</option>
</select>

<label data-fr="Début de l’horaire" data-en="Start time"></label>
<input id="start" type="time" value="08:00">

<label data-fr="Fin de l’horaire" data-en="End time"></label>
<input id="end" type="time" value="10:00">

<button id="addTime" class="full"
data-fr="Ajouter une page horaire" data-en="Add time slot"></button>
<div id="times"></div>

<button id="addDevice" class="full"
data-fr="Ajouter l’appareil" data-en="Add device"></button>
<div id="message" role="status"></div>
</div>

<div class="card">
<h2 data-fr="Appareils enregistrés" data-en="Saved devices"></h2>
<div id="list"></div>
</div>
</section>

<section id="history">
<div class="card">
<h2 data-fr="Historique" data-en="History"></h2>
<div id="logs"></div>
<button id="clear" class="danger full"
data-fr="Effacer l’historique" data-en="Clear history"></button>
</div>
</section>
</main>

<script>
"use strict";
const $=id=>document.getElementById(id);
let lang="fr",devices=[],logs=[],times=[],rates={};
const T=(fr,en)=>lang==="fr"?fr:en;
const countries=[
["Afrique du Sud","South Africa","ZAR"],
["Algérie","Algeria","DZD"],
["Angola","Angola","AOA"],
["Bénin","Benin","XOF"],
["Botswana","Botswana","BWP"],
["Burkina Faso","Burkina Faso","XOF"],
["Burundi","Burundi","BIF"],
["Cameroun","Cameroon","XAF"],
["Cap-Vert","Cape Verde","CVE"],
["Comores","Comoros","KMF"],
["Congo","Congo","XAF"],
["Côte d’Ivoire","Ivory Coast","XOF"],
["Djibouti","Djibouti","DJF"],
["Égypte","Egypt","EGP"],
["Érythrée","Eritrea","ERN"],
["Eswatini","Eswatini","SZL"],
["Éthiopie","Ethiopia","ETB"],
["Gabon","Gabon","XAF"],
["Gambie","Gambia","GMD"],
["Ghana","Ghana","GHS"],
["Guinée","Guinea","GNF"],
["Guinée-Bissau","Guinea-Bissau","XOF"],
["Guinée équatoriale","Equatorial Guinea","XAF"],
["Kenya","Kenya","KES"],
["Lesotho","Lesotho","LSL"],
["Liberia","Liberia","LRD"],
["Libye","Libya","LYD"],
["Madagascar","Madagascar","MGA"],
["Malawi","Malawi","MWK"],
["Mali","Mali","XOF"],
["Maroc","Morocco","MAD"],
["Maurice","Mauritius","MUR"],
["Mauritanie","Mauritania","MRU"],
["Mozambique","Mozambique","MZN"],
["Namibie","Namibia","NAD"],
["Niger","Niger","XOF"],
["Nigeria","Nigeria","NGN"],
["Ouganda","Uganda","UGX"],
["RCA","Central African Republic","XAF"],
["RDC","DR Congo","CDF"],
["Rwanda","Rwanda","RWF"],
["Sao Tomé-et-Principe","Sao Tome and Principe","STN"],
["Sénégal","Senegal","XOF"],
["Seychelles","Seychelles","SCR"],
["Sierra Leone","Sierra Leone","SLE"],
["Somalie","Somalia","SOS"],
["Soudan","Sudan","SDG"],
["Soudan du Sud","South Sudan","SSP"],
["Tanzanie","Tanzania","TZS"],
["Tchad","Chad","XAF"],
["Togo","Togo","XOF"],
["Tunisie","Tunisia","TND"],
["Zambie","Zambia","ZMW"],
["Zimbabwe","Zimbabwe","ZWG"]
];
function save(){
try{
localStorage.setItem("ecoV4",JSON.stringify({
devices,logs,rates,lang,country:$("country").value
}));
}catch(e){
$("message").textContent=T("Enregistrement local indisponible.","Local storage unavailable.");
}
}
let old={};
try{old=JSON.parse(localStorage.getItem("ecoV4")||"{}")}catch(e){}
devices=Array.isArray(old.devices)?old.devices:[];
logs=Array.isArray(old.logs)?old.logs:[];
rates=old.rates||{};
lang=old.lang==="en"?"en":"fr";

function show(page){
document.querySelectorAll("section").forEach(s=>{
s.classList.toggle("active",s.id===page);
});
window.scrollTo(0,0);
}
document.querySelectorAll("[data-page]").forEach(b=>{
b.onclick=()=>show(b.dataset.page);
});
function selectedCountry(){
return countries.find(c=>c[0]===$("country").value)||countries[0];
}
function countryOptions(){
let value=$("country").value||old.country||"Togo";
$("country").replaceChildren();
countries.forEach(c=>{
let o=new Option(c[lang==="fr"?0:1],c[0]);
$("country").add(o);
});
$("country").value=value;
}
function countryChanged(){
let c=selectedCountry();
let currency=c[2]==="XOF"?T("Franc CFA (XOF)","CFA franc (XOF)"):
c[2]==="XAF"?T("Franc CFA (XAF)","CFA franc (XAF)"):c[2];
$("currency").textContent=T("Monnaie : ","Currency: ")+currency;
$("rateLabel").textContent=T("Tarif du kWh : ","Price per kWh: ")+c[2];
$("rate").value=rates[c[0]]??"";
$("rateHelp").textContent=$("rate").value!==""?
T("Tarif de référence enregistré pour ce pays.","Saved reference rate for this country."):
T("Aucun tarif enregistré. Saisis le tarif de ta facture.",
"No saved rate. Enter the rate from your bill.");
}
$("country").onchange=()=>{countryChanged();save()};
$("rate").onchange=()=>{
let v=$("rate").value;
if(v!==""&&Number(v)>=0)rates[selectedCountry()[0]]=Number(v);
save();
};
function translate(){
document.documentElement.lang=lang;
document.querySelectorAll("[data-fr]").forEach(el=>{
el.textContent=el.dataset[lang];
});
$("lang").textContent=lang==="fr"?"English":"Français";
countryOptions();countryChanged();render();
}
$("lang").onclick=()=>{
lang=lang==="fr"?"en":"fr";
translate();save();
};
function mins(s){
if(!s||!s.includes(":"))return NaN;
let [h,m]=s.split(":").map(Number);
return h*60+m;
}
function makeButton(label,fn){
let b=document.createElement("button");
b.textContent=label;b.onclick=fn;return b;
}
function record(fr,en){
logs.unshift(new Date().toLocaleString()+" — "+T(fr,en));
logs=logs.slice(0,200);
save();
}
$("addTime").onclick=()=>{
let a=$("start").value,b=$("end").value;
let d=mins(a),f=mins(b);
if(!Number.isFinite(d)||!Number.isFinite(f)||f<=d||
times.some(t=>d<mins(t.b)&&f>mins(t.a))){
$("message").textContent=T("Horaire invalide ou chevauchant.",
"Invalid or overlapping time slot.");
return;
}
times.push({a,b});
$("message").textContent="";
render();
};
$("addDevice").onclick=()=>{
let name=$("name").value.trim();
let w=Number($("power").value)*Number($("unit").value);
let r=Number($("rate").value);
if(!name||!(w>0)||$("rate").value===""||r<0||!times.length){
$("message").textContent=T(
"Renseigne le nom, la puissance, le tarif et au moins un horaire.",
"Enter the name, power, rate and at least one time slot.");
return;
}
let h=times.reduce((s,t)=>s+(mins(t.b)-mins(t.a))/60,0);
let c=selectedCountry();
rates[c[0]]=r;
devices.push({name,w,h,r,country:c[0],currency:c[2]});
record("Appareil ajouté : "+name,"Device added: "+name);
times=[];
$("name").value="";
$("power").value="";
$("message").textContent="";
save();render();show("home");
};
function render(){
let energy=devices.reduce((s,a)=>s+a.w*a.h/1000,0);
$("stats").textContent=
T("Appareils : ","Devices: ")+devices.length+
"\n"+T("Consommation journalière : ","Daily consumption: ")+
energy.toFixed(2)+" kWh";

let costs={};
devices.forEach(a=>{
let cur=a.currency||"XOF";
costs[cur]=(costs[cur]||0)+a.w*a.h*a.r/1000;
});
Object.entries(costs).forEach(([cur,cost])=>{
$("stats").textContent+="\n"+T("Coût journalier : ","Daily cost: ")+
cost.toFixed(2)+" "+cur;
});
$("times").replaceChildren();
times.forEach((t,i)=>{
let row=document.createElement("div");
row.className="row";row.textContent=t.a+" – "+t.b+" ";
row.append(makeButton("×",()=>{times.splice(i,1);render()}));
$("times").append(row);
});
$("list").replaceChildren();
devices.forEach((a,i)=>{
let row=document.createElement("div");
row.className="row";
row.textContent=a.name+" — "+a.w+" W — "+a.h.toFixed(2)+" h/j";
row.append(makeButton(T("Supprimer","Delete"),()=>{
devices.splice(i,1);
record("Appareil supprimé : "+a.name,"Device deleted: "+a.name);
save();render();
}));
$("list").append(row);
});
$("logs").textContent=logs.join("\n")||T("Aucun historique","No history");
$("tips").textContent=energy>5?
T("Votre consommation estimée est élevée. Réduisez les durées d’utilisation et éteignez les appareils inutilisés.",
"Your estimated consumption is high. Reduce usage time and switch off unused devices."):
T("Éteignez les appareils inutilisés et privilégiez les équipements économes.",
"Switch off unused devices and choose energy-efficient equipment.");
}
$("clear").onclick=()=>{
if(confirm(T("Effacer tout l’historique ?","Clear all history?"))){
logs=[];save();render();
}
};
translate();
</script>
</body>
</html>
