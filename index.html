<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ÉcoÉnergie</title>
<style>
*{box-sizing:border-box}
:root{--dark:#174d36;--green:#328052;--light:#e5f2e5;--mint:#f2f8ef;--purple:#72539a;--gold:#d7b45b}
body{margin:0;font:16px Arial,sans-serif;color:#183d2b;background:#edf5e9}
header{background:linear-gradient(120deg,#174d36,#367e52,#568b55);color:white;padding:22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1,h2,h3,p{margin-top:0}header h1{margin:0}header small{display:block;margin-top:7px}
button,input,select{font:inherit;border-radius:10px;padding:11px}
button{border:0;background:var(--green);color:white;cursor:pointer;font-weight:bold}
button:hover{filter:brightness(1.08)}
nav{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:#cfe5cc}
nav button{flex:1;background:#fff;color:var(--dark)}
nav button.active{background:var(--dark);color:white}
main{max-width:1000px;margin:auto;padding:14px}
section{display:none}section.active{display:block}
.panel{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 3px 14px #174d3615}
.botanical{background:linear-gradient(120deg,#f7fbef,#e0efda);border:1px solid #c6ddbe;position:relative;overflow:hidden}
.plants{font-size:30px;letter-spacing:5px;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:#e8f3e3;border-radius:12px;padding:15px;border-left:4px solid #75a46b}
.card:nth-child(2n){background:#f0eaf7;border-color:var(--purple)}
.card strong{display:block;font-size:1.35rem;margin-top:8px}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,select{width:100%;border:1px solid #abc7ad;background:#fff;color:#173d28}
.full{display:block;width:100%;margin-top:12px}
.item{padding:13px 0;border-bottom:1px solid #d9e6db}
.danger{background:#a52e42}
.secondary{background:var(--purple)}
.note{font-size:14px;color:#4d6854}
.lcd{background:#19392c;color:#b8ffbf;border:4px solid #56896a;border-radius:14px;padding:18px}
.lcd .screen{background:#b5dcae;color:#173b25;border-radius:7px;padding:18px;font: bold 22px monospace;white-space:pre-wrap;min-height:90px}
.lcd button{margin:4px 4px 4px 0}
.warning{color:#a00025;font-weight:bold}
.blink{animation:alert 1s infinite}
@keyframes alert{0%,100%{background:#a52e42;color:white}50%{background:#ffb3bd;color:#650016}}
.report{background:#f1edf7;border-left:4px solid var(--purple);padding:14px;border-radius:10px;margin:10px 0}
dialog{border:0;border-radius:18px;max-width:600px;width:92%;max-height:85vh;overflow:auto;color:#183d2b}
dialog::backdrop{background:#102a20aa}
#msg{color:var(--purple);font-weight:bold}
 .lcd{background:#e8f1e5;color:#284b36;border:4px solid #a8c6a1;border-radius:14px;padding:18px}
.lcd .screen{background:#f5f1df;color:#344b35;border-radius:7px;padding:18px;font:bold 22px monospace;white-space:pre-wrap;min-height:90px}
.lcd button{margin:4px 4px 4px 0}
header {
    position: relative;
    display: block;
    text-align: center;
    background: linear-gradient(
        135deg,
        #064b32,
        #08754e,
        #12965c
    );
    color: white;
    padding: 32px 20px 85px;
    border-radius: 0 0 32px 32px;
    overflow: hidden;
    box-shadow: 0 5px 18px #174d3633;
}

header h1 {
    font-size: clamp(28px, 6vw, 44px);
    letter-spacing: 1px;
}

header h1::before {
    content: "🌱 ";
}

header small {
    display: block;
    margin-top: 12px;
    font-size: 17px;
    color: #e5f5df;
    letter-spacing: 1px;
}

header::before {
    content: "🌿";
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 30px;
    opacity: 0.7;
    pointer-events: none;
}

header::after {
    content: "🪴";
    position: absolute;
    bottom: 12px;
    left: 16px;
    font-size: 28px;
    pointer-events: none;
}

#lang {
    position: absolute;
    bottom: 16px;
    right: 18px;
    background: #07563b;
    color: white;
    border: 2px solid #bce9a9;
    border-radius: 30px;
    padding: 10px 20px;
    font-weight: bold;
    box-shadow: 0 3px 8px #003b2544;
} 
</style>
</head>
<body>
<header>
<div><h1>ÉcoÉnergie</h1><small data-t="team"></small></div>
<button id="lang">English</button>
</header>
<nav id="nav"></nav>
<main>
<section id="home" class="active">
<div class="panel botanical">
<div class="plants">🌿 🪴 🌱</div>
<h2 data-t="home"></h2>
<div id="stats" class="cards"></div>
<button class="full" id="goDevices" data-t="add"></button>
<button class="guide" id="guide" hidden data-t="guide"></button>
</div>
<div class="panel"><h3 data-t="devices"></h3><div id="homeList"></div></div>
<div class="panel lcd">
<h2>LCD</h2>
<div class="screen" id="lcdScreen"></div>
<button id="connect" data-t="connect"></button>
<button id="send" data-t="send"></button>
<p id="lcdStatus" role="status"></p>
</div>
</section>

<section id="devices">
<div class="panel">
<h2 data-t="devices"></h2>
<label for="country" data-t="country"></label>
<select id="country"></select>
<label for="rate" data-t="rate"></label>
<input id="rate" type="number" min="0" step="any">
<label for="limit" data-t="limit"></label>
<input id="limit" type="number" min="0" step="any">
<p class="note" data-t="rateNote"></p>
<button id="save" class="full" data-t="save"></button>
</div>
<div class="panel">
<h3 data-t="add"></h3>
<label for="preset" data-t="choose"></label>
<select id="preset"></select>
<label for="name" data-t="name"></label>
<input id="name" maxlength="80">
<label for="power" data-t="power"></label>
<input id="power" type="number" min="0.01" step="any">
<label for="start" data-t="start"></label>
<input id="start" type="time" value="08:00">
<label for="end" data-t="end"></label>
<input id="end" type="time" value="10:00">
<button id="slot" class="full" data-t="slot"></button>
<div id="slots"></div>
<button id="add" class="full" data-t="add"></button>
<p id="msg" role="status"></p>
</div>
<div class="panel"><h3 data-t="devices"></h3><div id="deviceList"></div></div>
</section>

<section id="monitor">
<div class="panel"><h2 data-t="monitor"></h2><div id="monitorBody"></div></div>
</section>
<section id="history">
<div class="panel"><h2 data-t="history"></h2><div id="logs"></div></div>
</section>
</main>

<dialog id="modal">
<h2 id="modalTitle"></h2>
<div id="modalBody"></div>
<button id="close" class="full" data-t="close"></button>
</dialog>

<script>
"use strict";
const fr={
team:"Les apprentis inventeurs",home:"Accueil",devices:"Appareils",
monitor:"Surveillance",history:"Historique",guide:"Mode d’utilisation",
add:"Ajouter un appareil",country:"Pays et devise",rate:"Tarif par kWh",
limit:"Limite quotidienne (kWh)",rateNote:"Tarif indicatif et modifiable selon votre fournisseur.",
save:"Enregistrer les réglages",choose:"Choisir un appareil",other:"Autre appareil",
name:"Nom de l’appareil",power:"Puissance (W)",start:"Heure de début",
end:"Heure de fin",slot:"Ajouter un créneau",remove:"Supprimer",
count:"Nombre d’appareils",total:"Puissance totale",daily:"Consommation/jour",
monthly:"Consommation/mois",cost:"Coût/jour",monthCost:"Coût mensuel",
empty:"Aucun élément.",invalid:"Vérifie les valeurs saisies.",
noSlots:"Ajoute au moins un créneau.",saved:"Réglages enregistrés.",
normal:"Consommation dans la limite.",exceeded:"Limite dépassée",
connect:"Connecter le LCD",send:"Envoyer au LCD",
unsupported:"Connexion série non prise en charge.",
connected:"LCD connecté.",failed:"Connexion ou envoi impossible.",
sent:"Données envoyées.",close:"Fermer",open:"Ouvrir le rapport",
report:"Rapport d’analyse",advice:"Conseils ciblés",
ranking:"Classement des consommateurs",hours:"Durée",
steps:[
"Ouvrir l’application et aller dans Appareils.",
"Choisir le pays, vérifier le tarif et fixer la limite.",
"Sélectionner un appareil et vérifier son nom et sa puissance.",
"Ajouter les créneaux horaires, puis ajouter l’appareil.",
"Revenir à l’accueil pour voir le tableau de bord.",
"Consulter Surveillance pour identifier les appareils à réduire.",
"Consulter Historique pour rouvrir les analyses.",
"Utiliser le LCD depuis l’accueil."
]
};
const en={
team:"The apprentice inventors",home:"Home",devices:"Devices",
monitor:"Monitoring",history:"History",guide:"User guide",
add:"Add a device",country:"Country and currency",rate:"Price per kWh",
limit:"Daily limit (kWh)",rateNote:"Indicative rate, editable to match your supplier.",
save:"Save settings",choose:"Choose a device",other:"Other device",
name:"Device name",power:"Power (W)",start:"Start time",
end:"End time",slot:"Add time slot",remove:"Delete",
count:"Number of devices",total:"Total power",daily:"Daily consumption",
monthly:"Monthly consumption",cost:"Daily cost",monthCost:"Monthly cost",
empty:"No items.",invalid:"Check the values entered.",
noSlots:"Add at least one time slot.",saved:"Settings saved.",
normal:"Consumption within the limit.",exceeded:"Limit exceeded",
connect:"Connect LCD",send:"Send to LCD",
unsupported:"Serial connection is not supported.",
connected:"LCD connected.",failed:"Connection or transmission failed.",
sent:"Data sent.",close:"Close",open:"Open report",
report:"Analysis report",advice:"Targeted advice",
ranking:"Consumer ranking",hours:"Duration",
steps:[
"Open the application and go to Devices.",
"Select the country, check the tariff and set the limit.",
"Select a device and check its name and power.",
"Add time slots, then add the device.",
"Return home to view the dashboard.",
"Open Monitoring to identify which devices to reduce.",
"Open History to review saved analyses.",
"Use the LCD from Home."
]
};
const countries={
"Togo":["XOF",125],"Bénin":["XOF",125],"Sénégal":["XOF",125],
"Mali":["XOF",125],"Burkina Faso":["XOF",125],"Côte d’Ivoire":["XOF",125],
"Cameroun":["XAF",80],"France":["EUR",0.25],"Ghana":["GHS",0],
"Nigeria":["NGN",0],"Maroc":["MAD",0],"Algérie":["DZD",0],
"Kenya":["KES",0],"Afrique du Sud":["ZAR",0]
};
const $=id=>document.getElementById(id);
const t=k=>(lang==="fr"?fr:en)[k]||k;
let lang="fr",page="home",slots=[],port=null,status="";
let state={devices:[],logs:[],rates:{},country:"Togo",limit:5};
try{
 const s=JSON.parse(localStorage.getItem("ecoV4")||"null");
 if(s&&typeof s==="object")state={...state,...s};
 lang=localStorage.getItem("ecoLang")==="en"?"en":"fr";
}catch(e){}
function n(v){const x=Number(v);return Number.isFinite(x)&&x>=0?x:0}
if(!Array.isArray(state.devices))state.devices=[];
if(!Array.isArray(state.logs))state.logs=[];
state.devices=state.devices.filter(d=>d&&typeof d==="object");
if(!state.rates||typeof state.rates!=="object")state.rates={};
if(!Object.prototype.hasOwnProperty.call(countries,state.country))state.country="Togo";
state.limit=n(state.limit);
function save(){
 try{
  localStorage.setItem("ecoV4",JSON.stringify(state));
  localStorage.setItem("ecoLang",lang);
 }catch(e){$("msg").textContent="Enregistrement local indisponible."}
}
function el(tag,text,parent){
 const x=document.createElement(tag);
 if(text!==undefined)x.textContent=String(text);
 if(parent)parent.appendChild(x);
 return x;
}
function button(text,action,parent){
 const b=el("button",text,parent);
 b.onclick=action;
 return b;
}
function fmt(v){return n(v).toLocaleString(lang==="fr"?"fr-FR":"en-US",{maximumFractionDigits:2})}
function rate(){
 const r=state.rates[state.country];
 return r===undefined?countries[state.country][1]:n(r);
}
function totals(ds){
 let w=0,k=0,c={};
 if(!Array.isArray(ds))ds=[];
 ds.forEach(d=>{
  if(!d||typeof d!=="object")return;
  const p=n(d.w),h=n(d.h),e=p*h/1000;
  const cur=d.currency||countries[state.country][0];
  w+=p;k+=e;c[cur]=(c[cur]||0)+e*n(d.r);
 });
 return {w,k,c};
}
function money(c,m){
 const a=Object.entries(c);
 return a.length?a.map(([cur,v])=>fmt(v*m)+" "+cur).join(" + "):
 "0 "+countries[state.country][0];
}
function go(id){
 page=id;
 document.querySelectorAll("main section").forEach(s=>s.classList.toggle("active",s.id===id));
 render();
}
function stat(label,value){
 const c=el("div",undefined,$("stats"));c.className="card";
 el("span",label,c);el("strong",value,c);
}
function deviceLine(d,parent){
 const row=el("div",undefined,parent);row.className="item";
 el("strong",d.name||"Appareil",row);
 el("p",fmt(d.w)+" W · "+fmt(d.h)+" h · "+fmt(n(d.w)*n(d.h)/1000)+" kWh/j",row);
 return row;
}
function render(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-t]").forEach(x=>x.textContent=t(x.dataset.t));
 $("lang").textContent=lang==="fr"?"English":"Français";
 $("nav").replaceChildren();
 ["home","devices","monitor","history","guide"].forEach(id=>{
 const b=button(t(id),()=>{
  if(id==="guide"){
    $("guide").click();
  }else{
    go(id);
  }
},$("nav")); 
  b.classList.toggle("active",id===page);
  if(id==="monitor"&&totals(state.devices).k>state.limit)b.classList.add("blink");
 });
 const z=totals(state.devices);
 $("stats").replaceChildren();
 stat(t("count"),state.devices.length);
 stat(t("total"),fmt(z.w)+" W");
 stat(t("daily"),fmt(z.k)+" kWh");
 stat(t("monthly"),fmt(z.k*30)+" kWh");
 stat(t("cost"),money(z.c,1));
 stat(t("monthCost"),money(z.c,30));
 $("lcdScreen").textContent=t("monthCost")+"\n"+money(z.c,30);
 $("lcdStatus").textContent=status?t(status):"";
 $("country").value=state.country;
 $("rate").value=rate();
 $("limit").value=state.limit;
 $("homeList").replaceChildren();
 $("deviceList").replaceChildren();
 if(!state.devices.length){
  el("p",t("empty"),$("homeList"));
  el("p",t("empty"),$("deviceList"));
 }
 state.devices.forEach((d,i)=>{
  deviceLine(d,$("homeList"));
  const row=deviceLine(d,$("deviceList"));
  button(t("remove"),()=>{
   state.devices.splice(i,1);save();render();
  },row);
 });
 $("slots").replaceChildren();
 slots.forEach((s,i)=>{
  const row=el("div",undefined,$("slots"));row.className="item";
  el("span",s.start+" – "+s.end+" ",row);
  button(t("remove"),()=>{slots.splice(i,1);render()},row);
 });
 renderMonitor();
 renderHistory();
}
function renderMonitor(){
 const box=$("monitorBody");box.replaceChildren();
 const z=totals(state.devices);
 const over=z.k>state.limit;
 el("p",fmt(z.k)+" / "+fmt(state.limit)+" kWh",box);
 const msg=el("h3",over?t("exceeded"):t("normal"),box);
 if(over)msg.className="warning";
 el("h3",t("ranking"),box);
 const sorted=state.devices.slice().sort((a,b)=>n(b.w)*n(b.h)-n(a.w)*n(a.h));
 let remaining=z.k;
 sorted.forEach(d=>{
  const e=n(d.w)*n(d.h)/1000;
  const row=deviceLine(d,box);
  if(over&&remaining>state.limit){
   const reduction=Math.min(e,remaining-state.limit);
   el("p",t("advice")+" : "+(d.name||"Appareil")+" — "+
   fmt(reduction)+" kWh/j à réduire.",row);
   remaining-=reduction;
  }
 });
 if(!sorted.length)el("p",t("empty"),box);
}
function renderHistory(){
 const box=$("logs");box.replaceChildren();
 if(!state.logs.length)el("p",t("empty"),box);
 state.logs.forEach((log,i)=>{
  if(!log||typeof log!=="object")return;
  const row=el("div",undefined,box);row.className="item";
  el("strong",String(log.date||t("report")),row);
  el("p",fmt(totals(log.devices).k)+" kWh/j",row);
  button(t("open"),()=>openReport(log),row);
  button(t("remove"),()=>{
   state.logs.splice(i,1);save();render();
  },row).className="danger";
 });
}
function openModal(title){
 $("modalTitle").textContent=title;
 $("modalBody").replaceChildren();
 $("modal").showModal();
}
function openReport(log){
 openModal(t("report")+" — "+String(log.date||""));
 const body=$("modalBody");
 const z=totals(log.devices);
 el("p",t("daily")+" : "+fmt(z.k)+" kWh",body);
 el("p",t("monthCost")+" : "+money(z.c,30),body);
 el("p",t("limit")+" : "+fmt(log.limit),body);
 if(Array.isArray(log.devices))log.devices.forEach(d=>{
  if(d&&typeof d==="object")deviceLine(d,body);
 });
}
function duration(a,b){
 const cv=s=>{const p=s.split(":").map(Number);return p[0]*60+p[1]};
 return ((cv(b)-cv(a)+1440)%1440)/60;
}
function settings(){
 const r=Number($("rate").value),l=Number($("limit").value);
 if($("rate").value===""||$("limit").value===""||
 !Number.isFinite(r)||r<0||!Number.isFinite(l)||l<0){
  $("msg").textContent=t("invalid");return false;
 }
 state.rates[state.country]=r;state.limit=l;save();return true;
}
Object.keys(countries).forEach(c=>{
 const o=el("option",c+" ("+countries[c][0]+")",$("country"));o.value=c;
});
const presets=[
 ["Télévision","Television"],["Ventilateur","Fan"],
 ["Réfrigérateur","Refrigerator"],["Climatiseur","Air conditioner"],
 ["Lampe","Lamp"],["Ordinateur","Computer"],["Fer à repasser","Iron"]
];
function fillPresets(){
 const p=$("preset"),old=p.value;
 p.replaceChildren();
 presets.forEach((a,i)=>{
  const o=el("option",a[lang==="fr"?0:1],p);o.value=String(i);
 });
 const o=el("option",t("other"),p);o.value="other";
 p.value=old||"0";
}
$("preset").onchange=()=>{
 const v=$("preset").value;
 $("name").value=v==="other"?"":presets[Number(v)][lang==="fr"?0:1];
};
$("lang").onclick=()=>{
 lang=lang==="fr"?"en":"fr";save();fillPresets();render();
};
$("goDevices").onclick=()=>go("devices");
$("country").onchange=()=>{
 state.country=$("country").value;
 $("rate").value=rate();save();
};
$("save").onclick=()=>{
 if(settings()){$("msg").textContent=t("saved");render()}
};
$("slot").onclick=()=>{
 const a=$("start").value,b=$("end").value;
 if(!a||!b||a===b){$("msg").textContent=t("invalid");return}
 slots.push({start:a,end:b});
 $("msg").textContent="";render();
};
$("add").onclick=()=>{
 const name=$("name").value.trim(),w=Number($("power").value);
 if(!name||!Number.isFinite(w)||w<=0){$("msg").textContent=t("invalid");return}
 if(!slots.length){$("msg").textContent=t("noSlots");return}
 if(!settings())return;
 const h=slots.reduce((sum,s)=>sum+duration(s.start,s.end),0);
 state.devices.push({name:name,w:w,h:h,r:rate(),currency:countries[state.country][0]});
 state.logs.unshift({
  date:new Date().toLocaleString(lang==="fr"?"fr-FR":"en-US"),
  devices:JSON.parse(JSON.stringify(state.devices)),
  limit:state.limit
 });
 slots=[];$("name").value="";$("power").value="";
 save();go("home");
};
$("guide").onclick=()=>{
 openModal(t("guide"));
 const list=el("ol",undefined,$("modalBody"));
 t("steps").forEach(s=>el("li",s,list));
};
$("close").onclick=()=>$("modal").close();
$("connect").onclick=async()=>{
 if(!("serial" in navigator)){status="unsupported";render();return}
 try{
  port=await navigator.serial.requestPort();
  await port.open({baudRate:9600});
  status="connected";
 }catch(e){status="failed"}
 render();
};
$("send").onclick=async()=>{
 let writer=null;
 try{
  if(!port||!port.writable)throw new Error("No port");
  writer=port.writable.getWriter();
  await writer.write(new TextEncoder().encode($("lcdScreen").textContent+"\n"));
  status="sent";
 }catch(e){status="failed"}
 finally{if(writer)writer.releaseLock()}
 render();
};
fillPresets();
$("preset").value="0";
$("preset").dispatchEvent(new Event("change"));
go("home");

</script>
</body>
</html>
