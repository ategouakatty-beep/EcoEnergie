<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f5b">
<link rel="manifest" href="./manifest.json">
<title>ÉcoÉnergie</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f1f7f3;color:#20332b}
header{background:#087f5b;color:white;text-align:center;padding:22px}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
button{padding:12px;border:0;border-radius:8px;background:#087f5b;color:white;font-size:16px;cursor:pointer;margin:5px 0}
nav button{flex:1}
main{max-width:850px;margin:auto;padding:12px}
section{display:none}
section.active{display:block}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:12px}
label{display:block;margin:12px 0 5px}
input{width:100%;padding:12px;font-size:16px;border:1px solid #b9cfc2;border-radius:6px}
.danger{background:#a83232}
.msg{padding:12px;white-space:pre-wrap}
.row{border-bottom:1px solid #ddd;padding:10px 0}
</style>
</head>
<body>

<header>
<h1>ÉcoÉnergie</h1>
<p>Les apprentis inventeurs</p>
</header>

<nav>
<button data-page="home">Accueil</button>
<button data-page="devices">Appareils</button>
<button data-page="monitor">Surveillance</button>
<button data-page="history">Historique</button>
</nav>

<main>
<section id="home" class="active">
<div class="card">
<h2>Tableau de bord</h2>
<div id="stats"></div>
<button id="go">Ajouter un appareil</button>
</div>
<div class="card">
<h2>Écran LCD</h2>
<p id="lcd">Non connecté</p>
<button id="connect">Connecter en USB</button>
</div>
</section>

<section id="devices">
<div class="card">
<h2>Ajouter un appareil</h2>
<label for="name">Nom</label>
<input id="name" placeholder="Ventilateur">

<label for="power">Puissance en watts</label>
<input id="power" type="number" min="0" value="75">

<label for="rate">Tarif FCFA/kWh</label>
<input id="rate" type="number" min="0" value="100">

<label for="start">Début</label>
<input id="start" type="time" value="08:00">

<label for="end">Fin</label>
<input id="end" type="time" value="10:00">

<button id="addTime">Ajouter une page horaire</button>
<div id="times"></div>

<button id="addDevice">Ajouter l'appareil</button>
<div id="message" class="msg" role="status"></div>
</div>

<div class="card">
<h2>Appareils enregistrés</h2>
<div id="list"></div>
<button class="danger" id="reset">Réinitialiser les appareils</button>
</div>
</section>

<section id="monitor">
<div class="card">
<h2>Surveillance</h2>
<label for="limit">Limite journalière kWh</label>
<input id="limit" type="number" min="0.01" value="5">
<p id="diagnostic"></p>
</div>
</section>

<section id="history">
<div class="card">
<h2>Historique automatique</h2>
<div id="logs"></div>
<button class="danger" id="clear">Effacer l'historique</button>
</div>
</section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
let devices = [];
let logs = [];
let times = [];
let writer = null;

function load(key) {
  try {
    const a = JSON.parse(localStorage.getItem(key) || "[]");
    return Array.isArray(a) ? a : [];
  } catch (e) {
    return [];
  }
}

devices = load("appareilsEco");
logs = load("historiqueEco");

function save() {
  try {
    localStorage.setItem("appareilsEco", JSON.stringify(devices));
    localStorage.setItem("historiqueEco", JSON.stringify(logs));
  } catch (e) {
    $("message").textContent = "Stockage indisponible";
  }
}

function page(id) {
  document.querySelectorAll("section").forEach(s => {
    s.classList.toggle("active", s.id === id);
  });
}

document.querySelectorAll("[data-page]").forEach(b => {
  b.onclick = () => page(b.dataset.page);
});
$("go").onclick = () => page("devices");

function min(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

function duration(t) {
  return (min(t.fin) - min(t.debut)) / 60;
}

function totals() {
  let p = 0, e = 0, c = 0;
  devices.forEach(a => {
    const w = Number(a.puissance) || 0;
    const d = Number(a.duree) || 0;
    const r = Number(a.tarif) || 0;
    p += w;
    e += w * d / 1000;
    c += w * d * r / 1000;
  });
  return {p, e, c};
}

function msg(s) {
  $("message").textContent = s;
}

function render() {
  const t = totals();

  $("stats").textContent =
    `Appareils : ${devices.length} | Puissance : ${t.p} W | Énergie : ${t.e.toFixed(2)} kWh/jour | Coût : ${t.c.toFixed(2)} FCFA/jour | Mois : ${(t.c * 30).toFixed(2)} FCFA`;

  $("times").textContent = times
    .map(t => t.debut + " – " + t.fin)
    .join(" ; ");

  $("list").innerHTML = "";

  devices.forEach((a, i) => {
    const div = document.createElement("div");
    div.className = "row";
    div.textContent = a.nom + " : " + a.puissance +
      " W, " + a.duree + " h/jour";

    const b = document.createElement("button");
    b.textContent = "Supprimer";
    b.onclick = () => {
      devices.splice(i, 1);
      record("Suppression");
    };

    div.append(b);
    $("list").append(div);
  });

  $("logs").textContent = logs
    .map(l => l.date + " — " + l.action + " : " + l.e + " kWh")
    .join("\n") || "Aucun historique";

  $("diagnostic").textContent =
    t.e > Number($("limit").value)
      ? "Limite dépassée"
      : "Consommation estimée : " + t.e.toFixed(2) + " kWh/jour";
}

function record(action) {
  logs.unshift({
    date: new Date().toLocaleString("fr-FR"),
    action,
    e: totals().e.toFixed(2)
  });
  logs = logs.slice(0, 100);
  save();
  render();
}
$("addTime").onclick = () => {
  const debut = $("start").value;
  const fin = $("end").value;

  if (!debut || !fin || min(fin) <= min(debut)) {
    msg("Choisissez une heure de fin après l'heure de début.");
    return;
  }

  if (times.some(t =>
    min(debut) < min(t.fin) &&
    min(fin) > min(t.debut)
  )) {
    msg("Cet horaire chevauche un horaire déjà ajouté.");
    return;
  }

  times.push({ debut, fin });

  $("times").textContent = times
    .map(t => t.debut + " – " + t.fin)
    .join(" ; ");

  msg("Page horaire ajoutée avec succès.");
};
$("addDevice").onclick = () => {
  const nom = $("name").value.trim();
  const puissance = Number($("power").value);
  const tarif = Number($("rate").value);

  if (!nom || !(puissance > 0) || !(tarif >= 0) || !times.length) {
    return msg("Renseignez le nom, la puissance et ajoutez une page horaire.");
  }

  devices.push({
    nom,
    puissance,
    tarif,
    duree: times.reduce((s, t) => s + duration(t), 0),
    pagesHoraires: times
  });

  times = [];
  record("Ajout");
  msg("Appareil ajouté");
};

$("reset").onclick = () => {
  if (confirm("Supprimer les appareils ?")) {
    devices = [];
    record("Réinitialisation");
  }
};

$("clear").onclick = () => {
  if (confirm("Effacer l'historique ?")) {
    logs = [];
    save();
    render();
  }
};

$("limit").oninput = render;

$("connect").onclick = async () => {
  try {
    if (!navigator.serial) {
      $("lcd").textContent = "Web Serial indisponible sur cet appareil";
      return;
    }

    const port = await navigator.serial.requestPort();
    await port.open({baudRate: 9600});
    writer = port.writable.getWriter();

    const t = totals();
    await writer.write(
      new TextEncoder().encode("ECOENERGIE " + t.c.toFixed(0) + "\n")
    );

    $("lcd").textContent = "Connecté";
  } catch (e) {
    $("lcd").textContent = "Connexion impossible : " + e.message;
  }
};

render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
