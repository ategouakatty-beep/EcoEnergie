<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ÉcoÉnergie</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#e7f4e8;color:#173d28}
header{background:#145c35;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1,h2,h3{margin:8px 0 16px}
button,input,select{font:inherit;border-radius:9px;padding:11px;border:1px solid #aac7b0}
button{background:#176c3c;color:white;border:0;cursor:pointer}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:#cde8d0}
nav button{flex:1;background:white;color:#145c35}
nav button.active{background:#145c35;color:white}
main{max-width:900px;margin:18px auto;padding:12px}
section{display:none;background:white;padding:20px;border-radius:16px}
section.active{display:block}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:#edf7ee;padding:15px;border-radius:12px}
.card strong{display:block;font-size:1.25rem;margin-top:8px}
label{display:block;margin:12px 0 5px}
input,select{width:100%;background:white;color:#173d28}
button.full{width:100%;margin-top:12px}
.item{padding:12px;border-bottom:1px solid #d9e6db}
.warning{color:#b00020;font-weight:bold}
.lcd{background:#173c29;color:#b8ffbf;padding:18px;border-radius:12px;margin-top:20px}
.lcd pre{white-space:pre-wrap;font:16px monospace}
.lcd button{margin:4px}
small{display:block;margin:10px 0}
</style>
</head>
<body>
<header>
<div><h1>ÉcoÉnergie</h1><small data-t="team"></small></div>
<button id="lang">English</button>
</header>
<nav id="nav"></nav>
<main>

<section id="home">
<h2 data-t="home"></h2>
<div class="cards" id="stats"></div>
<button class="full" data-go="devices" data-t="addDevice"></button>

<div class="lcd">
<h2>LCD</h2>
<pre id="lcdScreen"></pre>
<button id="connect" data-t="connect"></button>
<button id="send" data-t="send"></button>
<p id="lcdStatus" role="status"></p>
</div>
</section>

<section id="devices">
<h2 data-t="devices"></h2>
<label data-t="country"></label><select id="country"></select>
<label data-t="tariff"></label><input id="rate" type="number" min="0" step="any">
<label data-t="limit"></label><input id="limit" type="number" min="0" step="any">
<button class="full" id="saveSettings" data-t="save"></button>
<hr>
<label data-t="name"></label><input id="name">
<label data-t="power"></label><input id="power" type="number" min="0" step="any">
<label data-t="start"></label><input id="start" type="time">
<label data-t="end"></label><input id="end" type="time">
<button class="full" id="addSlot" data-t="addSlot"></button>
<div id="slots"></div>
<button class="full" id="add" data-t="addDevice"></button>
<div id="deviceList"></div>
</section>

<section id="monitor">
<h2 data-t="monitor"></h2>
<div id="monitorBody"></div>
</section>

<section id="history">
<h2 data-t="history"></h2>
<div id="logs"></div>
</section>

<section id="guide">
<h2 data-t="guide"></h2>
<ol id="steps"></ol>
</section>
</main>

<script>
const fr={
team:"Les apprentis inventeurs",home:"Accueil",devices:"Appareils",
monitor:"Surveillance",history:"Historique",guide:"Mode d’utilisation",
addDevice:"Ajouter un appareil",country:"Pays et devise",tariff:"Tarif par kWh",
limit:"Limite quotidienne (kWh)",save:"Enregistrer les réglages",
name:"Nom de l’appareil",power:"Puissance (W)",start:"Heure de début",
end:"Heure de fin",addSlot:"Ajouter un créneau",connect:"Connecter le LCD",
send:"Envoyer au LCD",count:"Nombre d’appareils",total:"Puissance totale",
daily:"Consommation/jour",monthly:"Consommation/mois",
cost:"Coût/jour",monthCost:"Coût/mois",remove:"Supprimer",
invalid:"Vérifie les valeurs saisies.",saved:"Réglages enregistrés",
exceeded:"Limite dépassée",normal:"Consommation dans la limite",
unsupported:"Connexion série non prise en charge sur cet appareil.",
connected:"LCD connecté",failed:"Connexion impossible",
noSlots:"Ajoute au moins un créneau.",sent:"Données envoyées",
steps:["Ouvre l’application et va dans Appareils.",
"Choisis le pays, vérifie le tarif et fixe la limite quotidienne.",
"Saisis le nom et la puissance du premier appareil.",
"Indique les heures de début et de fin, puis ajoute le créneau.",
"Ajoute l’appareil et répète ces étapes pour les autres appareils.",
"Consulte l’accueil, la surveillance et l’historique.",
"Depuis l’accueil, connecte le LCD si ton appareil est compatible."]
};
const en={
team:"The apprentice inventors",home:"Home",devices:"Devices",
monitor:"Monitoring",history:"History",guide:"User guide",
addDevice:"Add a device",country:"Country and currency",tariff:"Price per kWh",
limit:"Daily limit (kWh)",save:"Save settings",
name:"Device name",power:"Power (W)",start:"Start time",
end:"End time",addSlot:"Add time slot",connect:"Connect LCD",
send:"Send to LCD",count:"Number of devices",total:"Total power",
daily:"Daily consumption",monthly:"Monthly consumption",
cost:"Daily cost",monthCost:"Monthly cost",remove:"Delete",
invalid:"Check the values entered.",saved:"Settings saved",
exceeded:"Limit exceeded",normal:"Consumption within the limit",
unsupported:"Serial connection is not supported on this device.",
connected:"LCD connected",failed:"Connection failed",
noSlots:"Add at least one time slot.",sent:"Data sent",
steps:["Open the application and go to Devices.",
"Select the country, check the tariff and set the daily limit.",
"Enter the name and power of the first device.",
"Set the start and end times, then add the time slot.",
"Add the device and repeat these steps for the other devices.",
"Review Home, Monitoring and History.",
"From Home, connect the LCD if your device is compatible."]
};
const countries={
"Togo":["XOF",125],"Bénin":["XOF",125],"Sénégal":["XOF",125],
"Mali":["XOF",125],"Burkina Faso":["XOF",125],"Côte d’Ivoire":["XOF",125],
"Cameroun":["XAF",80],"France":["EUR",0.25],"Ghana":["GHS",1],
"Nigeria":["NGN",1],"Maroc":["MAD",1],"Algérie":["DZD",1],
"Kenya":["KES",1],"Afrique du Sud":["ZAR",1]
};
let state={devices:[],logs:[],rates:{},country:"Togo",limit:5};
let lang="fr",page="home",slots=[],port=null;
try{
let s=JSON.parse(localStorage.getItem("ecoV4")||"{}");
state={...state,...s};
if(!Array.isArray(state.devices))state.devices=[];
if(!Array.isArray(state.logs))state.logs=[];
if(!state.rates||typeof state.rates!=="object")state.rates={};
lang=localStorage.getItem("ecoLang")==="en"?"en":"fr";
}catch(e){}
if(!countries[state.country])state.country="Togo";
const $=id=>document.getElementById(id);
const t=k=>(lang==="fr"?fr:en)[k]||k;
function store(){
try{
localStorage.setItem("ecoV4",JSON.stringify(state));
localStorage.setItem("ecoLang",lang);
}catch(e){}
}
function el(tag,txt,parent){
let x=document.createElement(tag);
if(txt!==undefined)x.textContent=txt;
if(parent)parent.appendChild(x);
return x;
}
function fmt(n){
return Number(n||0).toLocaleString(lang==="fr"?"fr-FR":"en-US",
{maximumFractionDigits:2});
}
function rate(){
return Number(state.rates[state.country]??countries[state.country][1]);
}
function totals(devices=state.devices){
let w=0,k=0,c={};
devices.forEach(d=>{
let p=Number(d.w)||0,h=Number(d.h)||0,r=Number(d.r)||0;
w+=p;k+=p*h/1000;
let cur=d.currency||countries[state.country][0];
c[cur]=(c[cur]||0)+p*h/1000*r;
});
return {w,k,c};
}
function money(c,m=1){
return Object.entries(c).map(([cur,v])=>fmt(v*m)+" "+cur).join(" + ")||
"0 "+countries[state.country][0];
}
function screen(){
let z=totals();
return t("daily")+" : "+fmt(z.k)+" kWh\n"+
t("monthly")+" : "+fmt(z.k*30)+" kWh\n"+
t("cost")+" : "+money(z.c);
}
function render(){
document.documentElement.lang=lang;
document.querySelectorAll("[data-t]").forEach(x=>x.textContent=t(x.dataset.t));
$("lang").textContent=lang==="fr"?"English":"Français";
$("nav").replaceChildren();
["home","devices","monitor","history","guide"].forEach(p=>{
let b=el("button",t(p),$("nav"));
b.dataset.go=p;
b.classList.toggle("active",p===page);
});
let z=totals();
$("stats").replaceChildren();
[
[t("count"),state.devices.length],
[t("total"),fmt(z.w)+" W"],
[t("daily"),fmt(z.k)+" kWh"],
[t("monthly"),fmt(z.k*30)+" kWh"],
[t("cost"),money(z.c)],
[t("monthCost"),money(z.c,30)]
.forEach(([a,b])=>{
let c=el("div",undefined,$("stats"));c.className="card";
el("span",a,c);el("strong",b,c);
});
$("lcdScreen").textContent=screen();
$("country").value=state.country;
$("rate").value=rate();
$("limit").value=state.limit;
$("slots").replaceChildren();
slots.forEach((s,i)=>{
let row=el("div",undefined,$("slots"));
el("span",s.start+" – "+s.end+" ",row);
let b=el("button",t("remove"),row);
b.onclick=()=>{slots.splice(i,1);render()};
});
$("deviceList").replaceChildren();
state.devices.forEach((d,i)=>{
let row=el("div",undefined,$("deviceList"));row.className="item";
el("p",d.name+" · "+d.w+" W · "+fmt(d.h)+" h",row);
let b=el("button",t("remove"),row);
b.onclick=()=>{state.devices.splice(i,1);store();render()};
});
$("monitorBody").replaceChildren();
el("p",fmt(z.k)+" / "+fmt(state.limit)+" kWh",$("monitorBody"));
let over=z.k>Number(state.limit);
let msg=el("p",over?t("exceeded"):t("normal"),$("monitorBody"));
if(over)msg.className="warning";
$("logs").replaceChildren();
state.logs.forEach((l,i)=>{
let row=el("div",undefined,$("logs"));row.className="item";
el("p",l.date+" · "+fmt(totals(l.devices||[]).k)+" kWh",row);
let b=el("button",t("remove"),row);
b.onclick=()=>{state.logs.splice(i,1);store();render()};
});
$("steps").replaceChildren();
t("steps").forEach(s=>el("li",s,$("steps")));
}
function show(p){
page=p;
document.querySelectorAll("section").forEach(x=>x.classList.toggle("active",x.id===p));
render();
}
Object.keys(countries).forEach(c=>{
let o=el("option",c+" ("+countries[c][0]+")",$("country"));o.value=c;
});
document.addEventListener("click",e=>{
let b=e.target.closest("[data-go]");
if(b)show(b.dataset.go);
});
$("lang").onclick=()=>{lang=lang==="fr"?"en":"fr";store();render()};
$("country").onchange=()=>{
state.country=$("country").value;
$("rate").value=rate();store();
};
$("saveSettings").onclick=()=>{
let r=Number($("rate").value),l=Number($("limit").value);
if(!Number.isFinite(r)||r<0||!Number.isFinite(l)||l<0){
alert(t("invalid"));return;
}
state.rates[state.country]=r;state.limit=l;
store();alert(t("saved"));render();
};
$("addSlot").onclick=()=>{
let a=$("start").value,b=$("end").value;
if(!a||!b||a===b){alert(t("invalid"));return}
slots.push({start:a,end:b});render();
};
function hours(s){
let cv=v=>{let [h,m]=v.split(":").map(Number);return h+m/60};
return (cv(s.end)-cv(s.start)+24)%24;
}
$("add").onclick=()=>{
let name=$("name").value.trim(),w=Number($("power").value);
if(!name||!Number.isFinite(w)||w<=0){alert(t("invalid"));return}
if(!slots.length){alert(t("noSlots"));return}
state.devices.push({
name,w,h:slots.reduce((a,s)=>a+hours(s),0),
r:rate(),currency:countries[state.country][0]
});
state.logs.unshift({
date:new Date().toLocaleString(lang==="fr"?"fr-FR":"en-US"),
devices:JSON.parse(JSON.stringify(state.devices)),
limit:state.limit
});
slots=[];$("name").value="";$("power").value="";
store();show("home");
};
$("connect").onclick=async()=>{
if(!("serial" in navigator)){
$("lcdStatus").textContent=t("unsupported");return;
}
try{
port=await navigator.serial.requestPort();
await port.open({baudRate:9600});
$("lcdStatus").textContent=t("connected");
}catch(e){$("lcdStatus").textContent=t("failed")}
};
$("send").onclick=async()=>{
if(!port||!port.writable){
$("lcdStatus").textContent=t("failed");return;
}
let writer;
try{
writer=port.writable.getWriter();
await writer.write(new TextEncoder().encode(screen()+"\n"));
$("lcdStatus").textContent=t("sent");
}catch(e){$("lcdStatus").textContent=t("failed")}
finally{if(writer)writer.releaseLock()}
};
show("home");
</script>
</body>
</html>
